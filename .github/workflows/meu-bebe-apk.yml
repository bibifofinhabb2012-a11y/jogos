name: Gerar APK do Meu Bebê

on:
  push:
    paths:
      - 'meu-bebe/**'
      - '.github/workflows/meu-bebe-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meu-bebe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk meu-bebe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: meu-bebe-apk
          path: meu-bebe/meu-bebe.apk
