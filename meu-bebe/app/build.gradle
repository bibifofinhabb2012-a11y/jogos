plugins {
    id 'com.android.application'
}

android {
    namespace 'br.meubebe.app'
    compileSdk 34

    defaultConfig {
        applicationId 'br.meubebe.app'
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName '2.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // assinado com a chave de depuração: serve para instalar direto, não para a Play Store
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
